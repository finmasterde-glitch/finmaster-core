<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinMaster — Kfz-Versicherung в Германии</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="logo">FinMaster</div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="ru" class="lang-btn active">RU</button>
      <button data-lang="uk" class="lang-btn">UA</button>
      <button data-lang="en" class="lang-btn">EN</button>
      <button data-lang="de" class="lang-btn">DE</button>
      <button data-lang="pl" class="lang-btn">PL</button>
    </div>
  </header>

  <main class="hero">
    <h1 id="heroTitle">Помощь с автостраховкой в Германии</h1>
    <p id="heroSubtitle">Задай вопрос — отвечу на основе личного многолетнего опыта</p>
  </main>

  <section class="chat-widget">
    <div class="chat-messages" id="chatMessages">
      <div class="msg bot" id="welcomeMsg">
        👋 Привет! Я помогу разобраться со страховкой авто в Германии. Спроси что угодно — например, "сколько стоит?" или "какую выбрать?"
      </div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Напиши вопрос..." />
      <button id="chatSend">→</button>
    </div>
  </section>

  <footer class="footer">
    <a href="#" id="portalLink" target="_blank" rel="noopener">Сравнить цены на страховку</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
